<tspan x="474.4" y="210.0"><tspan fill="#ffa657" font-weight="bold">Consistency:</tspan><tspan fill="#484f58"> . </tspan><tspan fill="#c9d1d9">eventual. same goes for my replies</tspan></tspan>
